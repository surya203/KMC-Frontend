name: kmc_alumni_connect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  go_router: ^16.2.1
  flutter_dotenv: ^6.0.1
  dio: ^5.10.0
  shared_preferences: ^2.5.3
  file_picker: ^10.1.9
  url_launcher: ^6.3.2
  web: ^1.1.0
  http_parser: ^4.1.2
  crop_your_image: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  # Full-bleed yellow (matches icon) — no cream/white frame like Rapido
  adaptive_icon_background: "#FFDE59"
  adaptive_icon_foreground: assets/images/app_icon.png
  # Keep seal + text inside Android adaptive safe zone (avoids zoom/crop)
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#FFDE59"
    theme_color: "#1A2744"
  windows:
    generate: true
    image_path: assets/images/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  # Uncomment if you add custom fonts
  # fonts:
  #   - family: Cinzel
  #     fonts:
  #       - asset: assets/fonts/Cinzel-Regular.ttf
  #
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700