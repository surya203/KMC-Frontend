# Fast local/static build (nginx). Opens quickly — no Flutter debug reload loop.
# Usage:
#   docker compose -f docker-compose.dev.yml down
#   docker compose up --build -d
#
# For live Dart editing use docker-compose.dev.yml instead (slower).

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Local API host (override with your current LAN IP / production URL).
      ENV: ${ENV:-development}
      API_BASE_URL: ${API_BASE_URL:-http://192.168.0.17:8001}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-verification-documents}
      # Legacy optional — not required with Postgres media
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-verification-documents}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
