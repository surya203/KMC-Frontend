services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Default API host.
      ENV: ${ENV:-production}
      API_BASE_URL: ${API_BASE_URL:-http://200.141.2.90:8001}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-verification-documents}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      # Legacy optional — not required with Postgres media
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-verification-documents}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
