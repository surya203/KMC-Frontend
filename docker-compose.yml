services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Production defaults — override via .env / compose env for local/LAN.
      ENV: ${ENV:-production}
      API_BASE_URL: ${API_BASE_URL:-https://api.kmcalumni.net}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-verification-documents}
      # Public Razorpay key only (secret stays on backend).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_live_TGwiguT5HZKaNR}
      # Legacy optional — not required with Postgres media
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-verification-documents}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
