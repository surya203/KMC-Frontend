<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kmc_alumni_connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KMC Alumni Connect</title>
  <link rel="manifest" href="manifest.json">
  <script src="env-config.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    /* Pill scrollbar — Lovable / Chrome reference (thin track, rounded thumb, arrows) */
    :root {
      --kmc-scroll-track: #f2f0eb;
      --kmc-scroll-thumb: #8e95a3;
      --kmc-scroll-thumb-hover: #6b7280;
      --kmc-scroll-arrow: #6b7280;
    }

    html,
    body,
    flutter-view,
    flt-glass-pane {
      scrollbar-width: thin;
      scrollbar-color: var(--kmc-scroll-thumb) var(--kmc-scroll-track);
      -webkit-user-select: none;
      user-select: none;
    }

    /* Keep typing fields selectable/copyable */
    input,
    textarea,
    [contenteditable="true"] {
      -webkit-user-select: text;
      user-select: text;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--kmc-scroll-thumb) var(--kmc-scroll-track);
    }

    ::-webkit-scrollbar {
      width: 14px;
      height: 14px;
    }

    ::-webkit-scrollbar-track {
      background: var(--kmc-scroll-track);
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--kmc-scroll-thumb);
      border-radius: 100px;
      border: 3px solid var(--kmc-scroll-track);
      min-height: 48px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--kmc-scroll-thumb-hover);
    }

    ::-webkit-scrollbar-corner {
      background: var(--kmc-scroll-track);
    }

    /* Up / down arrow buttons like the reference */
    ::-webkit-scrollbar-button:single-button {
      display: block;
      height: 14px;
      width: 14px;
      background-color: var(--kmc-scroll-track);
    }

    ::-webkit-scrollbar-button:single-button:vertical:decrement {
      border-style: solid;
      border-width: 0 4px 6px 4px;
      border-color: transparent transparent var(--kmc-scroll-arrow) transparent;
      background-color: var(--kmc-scroll-track);
    }

    ::-webkit-scrollbar-button:single-button:vertical:increment {
      border-style: solid;
      border-width: 6px 4px 0 4px;
      border-color: var(--kmc-scroll-arrow) transparent transparent transparent;
      background-color: var(--kmc-scroll-track);
    }

    ::-webkit-scrollbar-button:single-button:horizontal:decrement,
    ::-webkit-scrollbar-button:single-button:horizontal:increment {
      display: none;
    }
  </style>
</head>
<body style="background-color: #faf9f6; margin: 0;">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
