name: Flutter CI

on:
  push:
    branches:
      - Suresh
      - main
  pull_request:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure .env exists for Flutter assets
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release

  docker:
    runs-on: ubuntu-latest
    needs: analyze-and-build

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t kmc-alumni-web:ci .
